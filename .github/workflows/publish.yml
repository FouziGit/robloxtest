# Manual publish to Roblox through the Open Cloud "Publish place" API.
# Disabled by default: runs only from the Actions tab (workflow_dispatch).
# Required repository secrets (see docs/STUDIO_SETUP.md):
#   ROBLOX_API_KEY  — Open Cloud API key with "universe-places:write" on the universe
#   UNIVERSE_ID     — the experience's universe id
#   PLACE_ID        — the start place id
name: Publish to Roblox

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Saved (draft) or Published (live)"
        required: true
        default: Saved
        type: choice
        options: [Saved, Published]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rokit
        run: |
          curl -fsSL https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install toolchain and packages
        run: |
          rokit install --no-trust-check
          wally install

      - name: Tests
        run: lune run tests/run

      - name: Build place
        run: |
          mkdir -p build
          rojo build default.project.json -o build/JutsuBattlegrounds.rbxl

      - name: Publish via Open Cloud
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: ${{ secrets.UNIVERSE_ID }}
          PLACE_ID: ${{ secrets.PLACE_ID }}
          VERSION_TYPE: ${{ inputs.version_type }}
        run: |
          test -n "$ROBLOX_API_KEY" -a -n "$UNIVERSE_ID" -a -n "$PLACE_ID" || { echo "Missing secrets"; exit 1; }
          curl --fail-with-body -sS -X POST \
            "https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=${VERSION_TYPE}" \
            -H "x-api-key: ${ROBLOX_API_KEY}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @build/JutsuBattlegrounds.rbxl
